<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Temple Pagoda & Dharmachakra Icon -->
  <g filter="url(#shadow)">
    <!-- Spire / Chhatra -->
    <path d="M256 60 L260 110 L252 110 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="55" r="7" fill="#fef08a" />
    <path d="M246 110 L266 110 L262 125 L250 125 Z" fill="url(#goldGrad)" />

    <!-- Top Tier Roof -->
    <path d="M256 125 L210 165 C225 163, 240 160, 256 160 C272 160, 287 163, 302 165 Z" fill="url(#goldGrad)" />
    <path d="M198 168 C215 162, 235 158, 256 158 C277 158, 297 162, 314 168 C318 169, 316 174, 310 174 C280 170, 232 170, 202 174 C196 174, 194 169, 198 168 Z" fill="#d97706" />

    <!-- Mid Tier Roof (Traditional Curved Khmer Temple Roof) -->
    <path d="M256 174 L170 226 C195 220, 225 216, 256 216 C287 216, 317 220, 342 226 Z" fill="url(#goldGrad)" />
    <!-- Eaves curl upward -->
    <path d="M152 230 C165 222, 210 212, 256 212 C302 212, 347 222, 360 230 C364 233, 360 238, 350 237 C300 232, 212 232, 162 237 C152 238, 148 233, 152 230 Z" fill="#f59e0b" />

    <!-- Main Tier Roof -->
    <path d="M256 237 L126 305 C165 296, 210 290, 256 290 C302 290, 347 296, 386 305 Z" fill="url(#goldGrad)" />
    <path d="M106 312 C125 298, 190 286, 256 286 C322 286, 387 298, 406 312 C412 316, 406 322, 392 320 C330 312, 182 312, 120 320 C106 322, 100 316, 106 312 Z" fill="#d97706" />

    <!-- Temple Pillars & Sanctuary Core -->
    <rect x="156" y="320" width="200" height="100" rx="6" fill="#fffbeb" opacity="0.95" />
    <rect x="174" y="324" width="16" height="96" rx="4" fill="#d97706" />
    <rect x="210" y="324" width="16" height="96" rx="4" fill="#d97706" />
    <rect x="286" y="324" width="16" height="96" rx="4" fill="#d97706" />
    <rect x="322" y="324" width="16" height="96" rx="4" fill="#d97706" />

    <!-- Entrance Archway / Doorway -->
    <path d="M236 420 L236 360 C236 348, 276 348, 276 360 L276 420 Z" fill="#78350f" />
    <!-- Warm Light within Sanctuary -->
    <ellipse cx="256" cy="385" rx="12" ry="18" fill="#fbbf24" opacity="0.8" />

    <!-- Foundation Steps / Plinth -->
    <path d="M120 420 L392 420 L406 438 L106 438 Z" fill="url(#goldGrad)" />
    <path d="M96 438 L416 438 L426 454 L86 454 Z" fill="#b45309" />
  </g>

  <!-- GPS Pin Indicator Subtle Badge -->
  <g transform="translate(355, 345)">
    <circle cx="35" cy="35" r="38" fill="#15803d" stroke="#fef08a" stroke-width="3" filter="url(#shadow)" />
    <!-- Direction Navigation Arrow -->
    <path d="M35 15 L52 50 L35 42 L18 50 Z" fill="#ffffff" />
  </g>
</svg>
